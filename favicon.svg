<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="50%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0e0ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Task cards -->
  <rect x="120" y="140" width="272" height="14" rx="7" fill="white" opacity="0.3"/>
  <rect x="120" y="175" width="272" height="14" rx="7" fill="white" opacity="0.3"/>
  <rect x="120" y="210" width="272" height="14" rx="7" fill="white" opacity="0.3"/>
  <!-- Checkmark circle -->
  <circle cx="100" cy="210" r="35" fill="white"/>
  <path d="M82 212 L94 224 L118 196" stroke="#8b5cf6" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Main icon: target/goal rings -->
  <circle cx="350" cy="310" r="80" fill="none" stroke="white" stroke-width="16" opacity="0.25"/>
  <circle cx="350" cy="310" r="48" fill="none" stroke="white" stroke-width="14" opacity="0.45"/>
  <circle cx="350" cy="310" r="18" fill="white" opacity="0.8"/>
  <!-- Arrow in center -->
  <path d="M340 295 L356 311 L340 327" stroke="#8b5cf6" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
